# Use a different project name and secret directory for each environment.
# The database has no published host port.
services:
  web:
    image: ${WEB_IMAGE:?Set an immutable web image reference}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the environment domain}
      OIDC_ORIGIN: ${OIDC_ORIGIN:?Set the identity provider origin}
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      app:
        ipv4_address: ${PROXY_IP:-172.29.0.2}
  api:
    image: ${API_IMAGE:?Set an immutable API image reference}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Authority: ${OIDC_AUTHORITY:-}
      Authentication__Audience: ${OIDC_AUDIENCE:-}
      Authentication__RoleClaimType: ${OIDC_ROLE_CLAIM:-roles}
      ReverseProxy__Address: ${PROXY_IP:-172.29.0.2}
    volumes:
      - ${SETTINGS_FILE:?Set a protected settings JSON path}:/app/appsettings.Production.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
  migrate:
    image: ${API_IMAGE:?Set an immutable API image reference}
    profiles: [release]
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - ${MIGRATION_SETTINGS_FILE:?Set protected migration settings path}:/app/appsettings.Production.json:ro
    networks:
      - app
  db:
    image: ${DB_IMAGE:?Set an immutable PostgreSQL 17 PostGIS image reference}
    restart: unless-stopped
    environment:
      POSTGRES_DB: routeboard
      POSTGRES_USER: routeboard_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
      - runtime_password
    volumes:
      - database:/var/lib/postgresql/data
      - ./initialize-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U routeboard_migrator -d routeboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app
networks:
  app:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.29.0.0/24}
          ip_range: ${APP_DYNAMIC_RANGE:-172.29.0.128/25}
volumes:
  database:
  certificates:
  caddy_config:
secrets:
  database_password:
    file: ${DATABASE_PASSWORD_FILE:?Set a protected password file path}
  runtime_password:
    file: ${RUNTIME_PASSWORD_FILE:?Set a protected runtime password file path}
