name: Build and verify
on:
  pull_request:
  push:
    branches: [main]
# The staging host follows the current main commit. Superseded runs cannot deploy.
concurrency:
  group: build-and-verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: routeboard
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U routeboard -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Build and test
        env:
          ROUTEBOARD_TEST_ADMIN_CONNECTION: 'Host=127.0.0.1;Port=5433;Database=postgres;Username=routeboard;Password=disposable-ci-only'
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          bash scripts/test.sh 2>&1 | tee evidence/test-output.txt
      - name: Build deployment images
        run: |
          set -o pipefail
          docker build -t routeboard-api:${{ github.sha }} . 2>&1 | tee evidence/api-image-build.txt
          docker build -f deploy/web.Dockerfile -t routeboard-web:${{ github.sha }} . 2>&1 | tee evidence/web-image-build.txt
          docker image inspect routeboard-api:${{ github.sha }} routeboard-web:${{ github.sha }} --format '{{.Id}}' > evidence/image-ids.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: evidence/
  staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://staging.mzcampuspulse.com
    steps:
      - uses: actions/checkout@v4
      - name: Build staging images for the ARM host
        run: |
          docker build -t "routeboard-api:$GITHUB_SHA" .
          mkdir -p frontend/public
          echo "$GITHUB_SHA" > frontend/public/release.txt
          docker build -f deploy/web.Dockerfile -t "routeboard-web:$GITHUB_SHA" \
            --build-arg VITE_OIDC_AUTHORITY=https://dev-okl8jqszwoasg244.us.auth0.com \
            --build-arg VITE_OIDC_CLIENT_ID=7RxLaeq6FzsyZey6iPig0RA6OmEWLgFX \
            --build-arg VITE_OIDC_AUDIENCE="$SITE/api" --build-arg VITE_OIDC_SCOPE=trips.write .
          docker image inspect "routeboard-api:$GITHUB_SHA" "routeboard-web:$GITHUB_SHA" --format '{{.Id}}'
          docker save "routeboard-api:$GITHUB_SHA" "routeboard-web:$GITHUB_SHA" | gzip > images.tar.gz
      - name: Publish versioned staging images
        run: |
          if ! gh release view "staging-$GITHUB_SHA" >/dev/null 2>&1; then
            gh release create "staging-$GITHUB_SHA" images.tar.gz --target "$GITHUB_SHA" \
              --prerelease --title "Staging $GITHUB_SHA" --notes "Verified staging candidate from run $GITHUB_RUN_ID."
          fi
      - name: Verify public release and health
        timeout-minutes: 12
        run: |
          for attempt in {1..60}; do
            if [[ "$(curl -fsS --max-time 5 "$SITE/release.txt" || true)" == "$GITHUB_SHA" ]] &&
               curl -fsS --max-time 5 "$SITE/healthz"; then exit 0; fi
            sleep 10
          done
          exit 1
